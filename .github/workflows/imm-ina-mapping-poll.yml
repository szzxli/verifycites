# INA <-> 8 U.S.C. mapping-table poller (OLRC Title 8 bulk XML).
#
# Weekly on Sundays (plus manual dispatch), downloads ONLY the OLRC
# Title 8 bulk XML zip for the current release point (the zip URL is
# derived from the OLRC download page on every run, never hard-coded)
# and rebuilds data/imm-ina-mapping.json, committing ONLY when it
# changed. No secrets, no keys, no tokens: the OLRC bulk download is
# keyless, and the script verifies TLS certificates (the --insecure
# flag is never passed here).
#
# Weekly, not 6-hourly, on purpose: the owner has established that
# core INA/8 CFR text changes rarely (OLRC release points are tied to
# public laws), so a weekly refresh of this metadata-only table is
# proportionate; the browser UI always labels the index time as an
# index time, never as a registry timestamp. The table is PARTIAL by
# design — only Code sections whose own sourceCredit cites the
# Immigration and Nationality Act as their origin get an entry — and
# unmapped rows keep their old "cannot confirm" wording.
#
# The published JSON is a static, same-origin file that the legal
# page reads; the browser page itself makes no third-party calls.

name: imm-ina-mapping-poll

on:
  schedule:
    - cron: "0 15 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Poll OLRC Title 8
        run: python3 scripts/imm-ina-mapping-poll.py
      - name: Commit mapping table if changed
        run: |
          git config user.name "imm-ina-mapping-poller"
          git config user.email "imm-ina-mapping-poller@users.noreply.github.com"
          git add data/imm-ina-mapping.json
          git diff --cached --quiet || git commit -m "Update INA mapping table (OLRC Title 8)"
          git push
