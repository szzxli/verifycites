# Tier-1 first-seen index poller.
#
# Every 6 hours (plus manual dispatch), polls the four exact, verified
# direct primary sources (Ninth Circuit RSS, Supreme Court slip-opinion
# index, arXiv API, Europe PMC API) and commits data/tier1-index.json
# ONLY when it changed. No secrets, no keys, no tokens: every source in
# this batch is free and keyless, and the script verifies TLS
# certificates (the --insecure flag is never passed here).
#
# The published JSON is a static, same-origin file that the browser
# pages read; the browser tool itself makes no third-party calls.

name: tier1-poll

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Poll Tier-1 sources
        run: python3 scripts/tier1_poll.py
      - name: Commit index if changed
        run: |
          git config user.name "tier1-poller"
          git config user.email "tier1-poller@users.noreply.github.com"
          git add data/tier1-index.json
          git diff --cached --quiet || git commit -m "Update Tier-1 first-seen index"
          git push
